---
- name: Capture and analyze disk IO data for high disk IO processes
  hosts: all
  become: true
  gather_facts: true

  vars:
    io_duration: 30      # Total capture duration in seconds
    io_interval: 1       # Snapshot interval in seconds
    io_top_n: 10         # Top N processes to report

  tasks:
    - name: Ensure sysstat package is installed
      ansible.builtin.package:
        name: sysstat
        state: present

    - name: Set output directory
      ansible.builtin.set_fact:
        io_dir: "/tmp/diskio-{{ ansible_date_time.iso8601_basic_short }}"

    - name: Create output directory
      ansible.builtin.file:
        path: "{{ io_dir }}"
        state: directory
        mode: "0755"

    - name: Run pidstat -d for {{ io_duration }}s ({{ io_duration }} snapshots, {{ io_interval }}s interval)
      ansible.builtin.shell:
        cmd: >
          pidstat -d {{ io_interval }} {{ io_duration }}
          > {{ io_dir }}/pidstat_output.txt 2>&1
      changed_when: true

    - name: Find top {{ io_top_n }} processes by total disk IO (read+write KB/s)
      ansible.builtin.shell:
        cmd: |
          grep -E '^[0-9]{2}:[0-9]{2}:[0-9]{2}' {{ io_dir }}/pidstat_output.txt | \
          awk '
          {
            if ($2 == "AM" || $2 == "PM") {
              user=$3; pid=$4; read=$5+0; write=$6+0
            } else {
              user=$2; pid=$3; read=$4+0; write=$5+0
            }
            iops=read+write
            cmd=$NF
            if (iops > peak[pid]) {
              peak[pid] = iops
              info[pid] = sprintf("PID: %-7s UID: %-6s kB_rd/s: %-12s kB_wr/s: %-12s CMD: %s",
                                  pid, user, read, write, cmd)
            }
          }
          END {
            for (pid in peak) print peak[pid], info[pid]
          }' | sort -rn | head -{{ io_top_n }} | awk '{$1=""; sub(/^ /, ""); print}'
      register: io_top_result
      changed_when: false

    - name: Get system-wide disk IO summary
      ansible.builtin.shell:
        cmd: |
          grep -E '^[0-9]{2}:[0-9]{2}:[0-9]{2}' {{ io_dir }}/pidstat_output.txt | \
          awk '{
            if ($2 == "AM" || $2 == "PM") { r+=$5; w+=$6 } else { r+=$4; w+=$5 }
            n++
          } END {
            if (n > 0)
              printf "Avg kB_rd/s: %.2f  Avg kB_wr/s: %.2f  Samples: %d\n", r/n, w/n, n
            else
              print "No data rows found in pidstat output"
          }'
      register: io_summary
      changed_when: false

    - name: Print disk IO analysis results
      ansible.builtin.debug:
        msg:
          - "========================================================="
          - "Disk IO Analysis — {{ inventory_hostname }}"
          - "Directory  : {{ io_dir }}"
          - "Duration   : {{ io_duration }}s | {{ io_duration }} snapshots | top {{ io_top_n }}"
          - "Tool       : pidstat -d (sysstat)"
          - "========================================================="
          - "System summary: {{ io_summary.stdout }}"
          - "========================================================="
          - "{{ io_top_result.stdout_lines | join('\n') if io_top_result.stdout else 'No disk IO activity detected during capture window' }}"
          - "========================================================="
