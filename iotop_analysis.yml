---
- name: Capture and analyze iotop data for high disk IO processes
  hosts: all
  become: true
  gather_facts: true

  vars:
    iotop_duration: 30     # Total capture duration in seconds
    iotop_interval: 1      # Snapshot interval in seconds
    io_top_n: 10           # Top N processes/threads to report

  tasks:
    - name: Ensure iotop package is installed
      ansible.builtin.package:
        name: iotop
        state: present

    - name: Set iotop output directory
      ansible.builtin.set_fact:
        iotop_dir: "/tmp/iotop-{{ ansible_date_time.iso8601_basic_short }}"
        iotop_snapshots: "{{ (iotop_duration / iotop_interval) | int }}"

    - name: Create iotop output directory
      ansible.builtin.file:
        path: "{{ iotop_dir }}"
        state: directory
        mode: "0755"

    - name: Run iotop for {{ iotop_duration }}s ({{ (iotop_duration / iotop_interval) | int }} snapshots, {{ iotop_interval }}s interval)
      ansible.builtin.shell:
        cmd: >
          iotop -b
          -n {{ (iotop_duration / iotop_interval) | int }}
          -d {{ iotop_interval }}
          > {{ iotop_dir }}/iotop_output.txt 2>&1
      changed_when: true

    - name: Find top {{ io_top_n }} processes by peak disk IO usage
      ansible.builtin.shell:
        cmd: |
          grep -E '^\s+[0-9]' {{ iotop_dir }}/iotop_output.txt | \
          awk '
          {
            tid=$1; user=$3
            read=$4" "$5; write=$6" "$7
            io=$10+0
            cmd=$12; for(i=13; i<=NF; i++) cmd=cmd" "$i
            if (io > peak[tid]) {
              peak[tid] = io
              info[tid] = sprintf("IO%%: %-7s TID: %-7s User: %-12s Read: %-12s Write: %-12s CMD: %s",
                                  io"%", tid, user, read, write, cmd)
            }
          }
          END {
            for (tid in peak) print peak[tid], info[tid]
          }' | sort -rn | head -{{ io_top_n }} | awk '{$1=""; sub(/^ /, ""); print}'
      register: io_top_result
      changed_when: false

    - name: Print top disk IO processes
      ansible.builtin.debug:
        msg:
          - "========================================================="
          - "Disk IO Analysis — {{ inventory_hostname }}"
          - "Directory  : {{ iotop_dir }}"
          - "Duration   : {{ iotop_duration }}s | {{ iotop_snapshots }} snapshots | top {{ io_top_n }}"
          - "========================================================="
          - "{{ io_top_result.stdout_lines | join('\n') if io_top_result.stdout else 'No disk IO activity detected during capture window' }}"
          - "========================================================="
